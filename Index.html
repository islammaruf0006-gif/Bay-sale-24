<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM Team — Professional Digital Services</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #060608;
    --deep: #0a0a0f;
    --card: #0f0f17;
    --orange: #ff6b2b;
    --orange-glow: #ff6b2b99;
    --teal: #00d4aa;
    --teal-glow: #00d4aa66;
    --white: #f0ede8;
    --muted: #7a7a8a;
    --border: #1e1e2e;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* Custom Cursor */
  #cursor {
    width: 12px; height: 12px;
    background: var(--orange);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s, width 0.2s, height 0.2s, background 0.2s;
    mix-blend-mode: screen;
  }
  #cursor-ring {
    width: 36px; height: 36px;
    border: 1.5px solid var(--teal);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%, -50%);
    transition: transform 0.18s ease, width 0.2s, height 0.2s, opacity 0.2s;
    opacity: 0.6;
  }

  /* Loading Screen */
  #loader {
    position: fixed; inset: 0;
    background: var(--black);
    z-index: 9000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    transition: opacity 0.6s ease;
  }
  .loader-logo {
    font-family: 'Syne', sans-serif;
    font-size: 2.8rem; font-weight: 800;
    letter-spacing: -0.02em;
  }
  .loader-logo span:first-child { color: var(--orange); }
  .loader-logo span:last-child { color: var(--teal); }
  .loader-bar {
    width: 200px; height: 2px;
    background: var(--border);
    border-radius: 2px; overflow: hidden;
  }
  .loader-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--orange), var(--teal));
    border-radius: 2px;
    animation: loadfill 1.6s ease forwards;
  }
  @keyframes loadfill { to { width: 100%; } }

  /* Canvas Bg */
  #bg-canvas {
    position: fixed; inset: 0;
    z-index: 0; pointer-events: none; opacity: 0.5;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 500;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 6vw;
    background: linear-gradient(180deg, rgba(6,6,8,0.95) 0%, transparent 100%);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.03);
    transition: background 0.3s;
  }
  .nav-logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem; font-weight: 800;
    letter-spacing: -0.03em;
  }
  .nav-logo .o { color: var(--orange); }
  .nav-logo .t { color: var(--teal); }
  .nav-links { display: flex; gap: 36px; list-style: none; }
  .nav-links a {
    color: var(--muted); text-decoration: none;
    font-size: 0.85rem; font-weight: 500; letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: color 0.2s;
    position: relative;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -4px; left: 0;
    width: 0; height: 1px;
    background: var(--orange);
    transition: width 0.3s;
  }
  .nav-links a:hover { color: var(--white); }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta {
    background: var(--orange); color: #fff;
    padding: 10px 22px; border-radius: 6px;
    font-size: 0.82rem; font-weight: 600;
    text-decoration: none; letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: box-shadow 0.3s, transform 0.2s;
    box-shadow: 0 0 20px var(--orange-glow);
  }
  .nav-cta:hover {
    box-shadow: 0 0 40px var(--orange-glow);
    transform: translateY(-1px);
  }
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
  .hamburger span { width: 22px; height: 1.5px; background: var(--white); transition: 0.3s; }

  /* HERO */
  #hero {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; align-items: center;
    padding: 120px 6vw 80px;
    overflow: hidden;
  }
  .hero-inner { max-width: 900px; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border);
    background: rgba(255,107,43,0.06);
    color: var(--orange); font-size: 0.78rem;
    padding: 7px 14px; border-radius: 100px;
    font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 28px;
    animation: fadeup 0.8s 1.8s both;
  }
  .hero-badge::before {
    content: ''; width: 6px; height: 6px;
    background: var(--orange); border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }

  .hero-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.8rem, 7vw, 6rem);
    font-weight: 800; line-height: 1.0;
    letter-spacing: -0.03em;
    margin-bottom: 22px;
    animation: fadeup 0.8s 2s both;
  }
  .hero-title .line1 { display: block; }
  .hero-title .line2 {
    display: block;
    background: linear-gradient(90deg, var(--orange) 0%, var(--teal) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-sub {
    font-size: 1.05rem; color: var(--muted); letter-spacing: 0.25em;
    text-transform: uppercase; margin-bottom: 44px;
    animation: fadeup 0.8s 2.2s both;
  }
  .hero-sub span { color: var(--orange); }
  .hero-sub span.t { color: var(--teal); }
  .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; animation: fadeup 0.8s 2.4s both; }
  .btn-glow {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--orange); color: #fff;
    padding: 16px 36px; border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem; font-weight: 700;
    text-decoration: none; letter-spacing: 0.04em;
    text-transform: uppercase;
    box-shadow: 0 0 40px var(--orange-glow), 0 0 80px rgba(255,107,43,0.15);
    transition: box-shadow 0.3s, transform 0.2s;
    position: relative; overflow: hidden;
  }
  .btn-glow::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: translateX(-100%); transition: transform 0.5s;
  }
  .btn-glow:hover::before { transform: translateX(100%); }
  .btn-glow:hover {
    box-shadow: 0 0 60px var(--orange-glow), 0 0 120px rgba(255,107,43,0.25);
    transform: translateY(-2px);
  }
  .btn-outline {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid var(--border);
    color: var(--white);
    padding: 16px 36px; border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem; font-weight: 600;
    text-decoration: none; letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: border-color 0.3s, color 0.3s;
  }
  .btn-outline:hover { border-color: var(--teal); color: var(--teal); }

  .hero-orb {
    position: absolute; right: -10vw; top: 50%;
    transform: translateY(-50%);
    width: clamp(300px, 45vw, 600px);
    height: clamp(300px, 45vw, 600px);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,43,0.12) 0%, rgba(0,212,170,0.06) 50%, transparent 70%);
    animation: orbpulse 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes orbpulse { 0%,100%{transform:translateY(-50%) scale(1)} 50%{transform:translateY(-50%) scale(1.08)} }

  .scroll-hint {
    position: absolute; bottom: 36px; left: 6vw;
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-size: 0.75rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    animation: fadeup 1s 3s both;
  }
  .scroll-line {
    width: 40px; height: 1px; background: var(--muted);
    position: relative; overflow: hidden;
  }
  .scroll-line::after {
    content: ''; position: absolute; left: -100%; top: 0;
    width: 100%; height: 100%; background: var(--orange);
    animation: scrollslide 1.6s ease-in-out infinite;
  }
  @keyframes scrollslide { 0%{left:-100%} 100%{left:100%} }

  /* SECTIONS */
  section { position: relative; z-index: 1; }
  .section-header { text-align: center; margin-bottom: 60px; }
  .section-label {
    display: inline-block;
    color: var(--orange); font-size: 0.75rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    font-weight: 600; margin-bottom: 14px;
  }
  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 4vw, 3.2rem);
    font-weight: 800; letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .section-title .accent { color: var(--teal); }
  .section-desc { color: var(--muted); margin-top: 14px; font-size: 1rem; max-width: 480px; margin-left: auto; margin-right: auto; }

  /* SERVICES */
  #services { padding: 100px 6vw; }
  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .service-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 30px 28px;
    position: relative; overflow: hidden;
    transition: transform 0.3s ease, border-color 0.3s, box-shadow 0.3s;
    cursor: default;
  }
  .service-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,107,43,0.04) 0%, rgba(0,212,170,0.04) 100%);
    opacity: 0; transition: opacity 0.3s;
  }
  .service-card::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--orange), var(--teal), transparent);
    opacity: 0; transition: opacity 0.3s;
  }
  .service-card:hover { transform: translateY(-6px); border-color: rgba(255,107,43,0.3); box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255,107,43,0.08); }
  .service-card:hover::before { opacity: 1; }
  .service-card:hover::after { opacity: 1; }
  .service-card:hover .service-icon { animation: iconbounce 0.5s ease; }

  .service-icon {
    width: 52px; height: 52px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; margin-bottom: 20px;
    position: relative;
    transition: box-shadow 0.3s;
  }
  .service-card:hover .service-icon { box-shadow: 0 0 20px var(--icon-glow, var(--orange-glow)); }
  @keyframes iconbounce { 0%,100%{transform:scale(1)} 40%{transform:scale(1.2)} 70%{transform:scale(0.95)} }

  .ic-orange { background: rgba(255,107,43,0.12); --icon-glow: var(--orange-glow); }
  .ic-teal { background: rgba(0,212,170,0.12); --icon-glow: var(--teal-glow); }

  .service-name {
    font-family: 'Syne', sans-serif;
    font-size: 1rem; font-weight: 700;
    margin-bottom: 10px; letter-spacing: -0.01em;
  }
  .service-desc { color: var(--muted); font-size: 0.85rem; line-height: 1.6; }
  .service-tag {
    margin-top: 18px; display: inline-block;
    font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--teal); font-weight: 600;
  }

  /* WHY US */
  #why {
    padding: 100px 6vw;
    background: linear-gradient(180deg, transparent, rgba(255,107,43,0.03) 50%, transparent);
  }
  .why-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px;
  }
  .why-card {
    text-align: center; padding: 40px 28px;
    border: 1px solid var(--border);
    border-radius: 16px; background: var(--card);
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .why-card:hover { transform: translateY(-4px); box-shadow: 0 0 40px rgba(0,212,170,0.07); }
  .why-icon {
    font-size: 2.2rem; margin-bottom: 18px;
    display: inline-block;
    animation: floaticon 3s ease-in-out infinite;
  }
  .why-card:nth-child(2) .why-icon { animation-delay: 0.4s; }
  .why-card:nth-child(3) .why-icon { animation-delay: 0.8s; }
  .why-card:nth-child(4) .why-icon { animation-delay: 1.2s; }
  @keyframes floaticon { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .why-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.05rem; font-weight: 700; margin-bottom: 10px;
  }
  .why-desc { color: var(--muted); font-size: 0.85rem; line-height: 1.6; }

  /* STATS */
  #stats { padding: 60px 6vw; }
  .stats-row {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 0;
    border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; background: var(--card);
  }
  .stat-item {
    flex: 1; min-width: 160px;
    padding: 40px 24px; text-align: center;
    border-right: 1px solid var(--border);
  }
  .stat-item:last-child { border-right: none; }
  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 2.4rem; font-weight: 800;
    background: linear-gradient(135deg, var(--orange), var(--teal));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    display: block; margin-bottom: 8px;
  }
  .stat-label { color: var(--muted); font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; }

  /* CONTACT */
  #contact { padding: 100px 6vw; }
  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px; align-items: center;
  }
  .contact-left .section-header { text-align: left; margin-bottom: 0; }
  .contact-desc { color: var(--muted); font-size: 0.95rem; line-height: 1.7; margin-top: 16px; }
  .contact-methods { display: flex; flex-direction: column; gap: 14px; margin-top: 36px; }
  .contact-btn {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 22px; border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    text-decoration: none; color: var(--white);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    font-size: 0.9rem;
  }
  .contact-btn:hover { transform: translateX(6px); }
  .contact-btn.wa:hover { border-color: #25d366; box-shadow: 0 0 20px rgba(37,211,102,0.15); }
  .contact-btn.tg:hover { border-color: #0088cc; box-shadow: 0 0 20px rgba(0,136,204,0.15); }
  .contact-btn.fb:hover { border-color: #1877f2; box-shadow: 0 0 20px rgba(24,119,242,0.15); }
  .contact-btn.gm:hover { border-color: #ea4335; box-shadow: 0 0 20px rgba(234,67,53,0.15); }
  .cb-icon {
    width: 42px; height: 42px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.15rem; flex-shrink: 0;
  }
  .cb-icon.wa { background: rgba(37,211,102,0.12); }
  .cb-icon.tg { background: rgba(0,136,204,0.12); }
  .cb-icon.fb { background: rgba(24,119,242,0.12); }
  .cb-icon.gm { background: rgba(234,67,53,0.12); }
  .cb-text { flex: 1; }
  .cb-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }
  .cb-value { font-size: 0.9rem; font-weight: 500; }
  .cb-arrow { color: var(--muted); font-size: 0.8rem; }
  .contact-visual {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 40px;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
    position: relative; overflow: hidden;
  }
  .contact-visual::before {
    content: '';position: absolute;
    top: -40%; left: -40%; width: 80%; height: 80%;
    background: radial-gradient(circle, rgba(255,107,43,0.08), transparent 70%);
    animation: orbpulse 5s ease-in-out infinite;
  }
  .contact-visual::after {
    content: '';position: absolute;
    bottom: -40%; right: -40%; width: 80%; height: 80%;
    background: radial-gradient(circle, rgba(0,212,170,0.08), transparent 70%);
    animation: orbpulse 5s 2.5s ease-in-out infinite;
  }
  .cv-logo {
    font-family: 'Syne', sans-serif;
    font-size: 3.5rem; font-weight: 800;
    letter-spacing: -0.04em;
    position: relative; z-index: 1;
  }
  .cv-logo span:first-child { color: var(--orange); }
  .cv-logo span:last-child { color: var(--teal); }
  .cv-tagline { color: var(--muted); font-size: 0.82rem; letter-spacing: 0.2em; text-transform: uppercase; position: relative; z-index: 1; }
  .cv-badges { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; position: relative; z-index: 1; }
  .cv-badge {
    border: 1px solid var(--border); border-radius: 100px;
    padding: 6px 14px; font-size: 0.75rem; color: var(--muted);
    font-weight: 500;
  }

  /* FOOTER */
  footer {
    position: relative; z-index: 1;
    border-top: 1px solid var(--border);
    padding: 50px 6vw 40px;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }
  .footer-logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em;
  }
  .footer-logo span:first-child { color: var(--orange); }
  .footer-logo span:last-child { color: var(--teal); }
  .footer-tagline { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; }
  .footer-socials { display: flex; gap: 14px; }
  .social-btn {
    width: 42px; height: 42px;
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; font-size: 1.1rem;
    color: var(--muted);
    transition: border-color 0.2s, color 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  .social-btn:hover { color: var(--white); transform: translateY(-3px); }
  .social-btn.fb:hover { border-color: #1877f2; box-shadow: 0 0 16px rgba(24,119,242,0.2); }
  .social-btn.tg:hover { border-color: #0088cc; box-shadow: 0 0 16px rgba(0,136,204,0.2); }
  .social-btn.em:hover { border-color: var(--orange); box-shadow: 0 0 16px rgba(255,107,43,0.2); }
  .footer-copy { color: var(--muted); font-size: 0.78rem; }

  /* ANIMATIONS */
  @keyframes fadeup {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .reveal {
    opacity: 0; transform: translateY(30px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* DIVIDER */
  .section-divider {
    height: 1px; background: var(--border);
    max-width: 80px; margin: 0 auto 60px;
    position: relative;
  }
  .section-divider::after {
    content: ''; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 1px; background: var(--orange);
  }

  /* MOBILE */
  @media (max-width: 768px) {
    .nav-links, .nav-cta { display: none; }
    .hamburger { display: flex; }
    .hero-orb { display: none; }
    .contact-grid { grid-template-columns: 1fr; }
    .stats-row { flex-direction: column; }
    .stat-item { border-right: none; border-bottom: 1px solid var(--border); }
    .stat-item:last-child { border-bottom: none; }
    body { cursor: auto; }
    #cursor, #cursor-ring { display: none; }
  }

  /* Mobile Menu */
  #mobile-menu {
    display: none; position: fixed; inset: 0;
    background: rgba(6,6,8,0.98); z-index: 400;
    flex-direction: column; align-items: center; justify-content: center; gap: 32px;
    backdrop-filter: blur(20px);
  }
  #mobile-menu.open { display: flex; }
  #mobile-menu a {
    font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 700;
    color: var(--white); text-decoration: none; letter-spacing: -0.02em;
    transition: color 0.2s;
  }
  #mobile-menu a:hover { color: var(--orange); }
  #mobile-menu .close-btn {
    position: absolute; top: 24px; right: 6vw;
    font-size: 1.6rem; cursor: pointer; color: var(--muted);
  }
</style>
</head>
<body>

<!-- Cursor -->
<div id="cursor"></div>
<div id="cursor-ring"></div>

<!-- Loader -->
<div id="loader">
  <div class="loader-logo"><span>MM</span><span>Team</span></div>
  <div class="lo
